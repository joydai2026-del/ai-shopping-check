name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Every Monday 13:00 UTC. GitHub emails the repo owner if a scheduled run fails.
    - cron: '0 13 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Unit + server + end-to-end. Offline: the scanner only hits local fake stores.
      # The live smoke test stays skipped (it needs LIVE_SMOKE=1).
      - run: npm test
      # Headless browser test of the real page, using the Chrome preinstalled on the runner.
      - name: Browser test
        run: CHROME_PATH="$(command -v google-chrome || command -v chromium)" npm run test:browser

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (official release, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full git history
        run: ./gitleaks git --redact --verbose .
