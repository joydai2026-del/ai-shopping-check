name: Dependabot auto-merge

# Runs after CI finishes. Merges a Dependabot PR only when CI passed on it
# and the update is a patch or minor version bump. Major bumps wait for a human.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Find the PR, check author and bump size, then merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          pr=$(gh pr list -R "$REPO" --state open --head "$HEAD_BRANCH" --json number,author,headRefOid,title \
            --jq "map(select(.headRefOid == \"$HEAD_SHA\" and .author.login == \"app/dependabot\"))[0]")
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then echo "No open Dependabot PR at $HEAD_SHA; nothing to do."; exit 0; fi
          number=$(echo "$pr" | jq -r .number)
          title=$(echo "$pr" | jq -r .title)
          # Grouped PRs only contain minor and patch updates (see dependabot.yml).
          if echo "$HEAD_BRANCH" | grep -q 'minor-and-patch'; then
            echo "Grouped minor/patch update."
          else
            # Single update title: "Bump X from 1.2.3 to 1.3.0". Merge only if the major number is unchanged.
            from=$(echo "$title" | sed -nE 's/.* from v?([0-9]+)\..* to v?([0-9]+)\..*/\1/p')
            to=$(echo "$title" | sed -nE 's/.* from v?([0-9]+)\..* to v?([0-9]+)\..*/\2/p')
            if [ -z "$from" ] || [ -z "$to" ] || [ "$from" != "$to" ]; then
              echo "Not a clear minor or patch bump ($title); leaving it for a human."; exit 0
            fi
          fi
          gh pr merge "$number" -R "$REPO" --squash --match-head-commit "$HEAD_SHA"
